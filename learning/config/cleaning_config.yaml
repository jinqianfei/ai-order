# 清洗规则配置（自学习自动维护）
# 由 improver.py 根据 cleaning_rule_gap_log 表数据更新
# v3.0: _clean_product_name 从此文件加载正则规则

# 括号清洗规则 — 去除括号及其内容
bracket_patterns:
  - pattern: '[\uff08(][^)\uff09]*[\uff09)]'
    description: '去除中英文括号及其内容'

# 空白清洗规则（正则表达式）
whitespace_pattern: '\s+'

# 末尾孤立分隔符清洗规则
trailing_separators: '[-_./\\,;:]+$'

# 开头孤立分隔符清洗规则
leading_separators: '^[-_./\\,;:]+'

# 候选规则（由 effect_tracker/improver 自动添加，待人工 review 后启用）
# status: pending_review = 待审核, active = 已启用, rejected = 已拒绝
candidate_rules: []
